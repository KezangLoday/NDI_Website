<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { bands: [] };
  _topFade = 'linear-gradient(to bottom, transparent 0, transparent 480px, #000 780px, #000 100%)';
  ndiRandomString(n) {
    const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let out = '';
    for (let i = 0; i < n; i++) out += cs.charAt(Math.floor(Math.random() * cs.length));
    return out;
  }
  setupEvervaultCards = () => {
    document.querySelectorAll('.ndi-ev').forEach((card) => {
      if (card.dataset.evReady) return;
      card.dataset.evReady = '1';
      const noise = card.querySelector('.ndi-ev-noise p');
      if (noise) noise.textContent = this.ndiRandomString(1400);
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
        if (noise) noise.textContent = this.ndiRandomString(1400);
      });
    });
  };
  applyMasks() {
    const bl = document.getElementById('ndiCircuitBase');
    if (bl) {
      // circuits stay dark; only the cursor-tracked glow layer reveals them
      bl.style.opacity = '0';
      bl.style.webkitMaskImage = this._topFade;
      bl.style.maskImage = this._topFade;
      bl.style.webkitMaskComposite = 'source-over';
      bl.style.maskComposite = 'add';
    }
  }
  computeBands = () => {
    // measure the page WITHOUT these layers, else each pass grows the document
    const bl0 = document.getElementById('ndiCircuitBase');
    const gl0 = document.getElementById('ndiCircuitGlow');
    const prevH = [bl0 && bl0.style.height, gl0 && gl0.style.height];
    if (bl0) bl0.style.height = '0px';
    if (gl0) gl0.style.height = '0px';
    const h = Math.max(document.documentElement.scrollHeight, window.innerHeight);
    if (bl0) bl0.style.height = prevH[0] || '0px';
    if (gl0) gl0.style.height = prevH[1] || '0px';
    const bandH = Math.round(900 * (Math.min(window.innerWidth, 1920) / 1440));
    const variants = ['#ndiTA', '#ndiTB', '#ndiTC'];
    const n = Math.ceil(h / bandH);
    const bands = [];
    for (let i = 0; i < n; i++) bands.push({ top: i * bandH, h: bandH, ref: variants[i % variants.length] });
    const bl = document.getElementById('ndiCircuitBase');
    const gl = document.getElementById('ndiCircuitGlow');
    if (bl) bl.style.height = h + 'px';
    if (gl) gl.style.height = h + 'px';
    const prev = this.state.bands || [];
    if (prev.length !== bands.length || (prev[0] && prev[0].h !== bandH)) this.setState({ bands });
  };
  setupReveals = () => {
    this._seen = this._seen || new WeakSet();
    const motion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const els = Array.from(document.querySelectorAll('[data-reveal]')).filter((el) => !this._seen.has(el));
    els.forEach((el) => {
      this._seen.add(el);
      el.style.transition = 'none';
      el.style.opacity = '1';
      void el.offsetWidth;
      el.style.transition = 'transform 0.7s var(--ease-out)';
      if (!motion) { el.style.transform = 'none'; return; }
      if (!this._io) {
        this._io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.style.transform = 'none'; this._io.unobserve(e.target); } });
        }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
      }
      this._io.observe(el);
    });
  };
  componentDidMount() {
    this.applyMasks();
    this.computeBands();
    this.setupReveals();
    this.setupEvervaultCards();
    this._timers = [120, 400, 900, 1800, 3200, 5000, 8000].map((t) => setTimeout(() => { this.computeBands(); this.setupReveals(); this.setupEvervaultCards(); }, t));
    if (window.MutationObserver) {
      this._mo = new MutationObserver(() => { clearTimeout(this._moT); this._moT = setTimeout(() => { this.computeBands(); this.setupReveals(); this.setupEvervaultCards(); }, 160); });
      this._mo.observe(document.body, { childList: true, subtree: true });
    }
    this._onResize = () => { clearTimeout(this._rzT); this._rzT = setTimeout(this.computeBands, 200); };
    window.addEventListener('resize', this._onResize);
    // circuit glow under the cursor, with an idle roaming spotlight
    const cg = document.getElementById('ndiCircuitGlow');
    if (cg) {
      const apply = (px, py, r, strong) => {
        const spot = 'radial-gradient(' + r + 'px circle at ' + px + 'px ' + py + 'px, #000 0%, transparent 72%)';
        cg.style.webkitMaskImage = spot + ', ' + this._topFade;
        cg.style.webkitMaskComposite = 'source-in';
        cg.style.maskImage = spot + ', ' + this._topFade;
        cg.style.maskComposite = 'intersect';
        cg.style.opacity = strong ? '1' : '0.85';
      };
      let lastMove = -9999;
      this._onMove = (e) => { lastMove = performance.now(); apply(e.pageX, e.pageY, 300, true); };
      window.addEventListener('mousemove', this._onMove, { passive: true });
      cg.style.opacity = '0';
      this._onLeave = () => { cg.style.opacity = '0'; };
      document.addEventListener('mouseleave', this._onLeave);
    }
    // spotlight coords for glass cards
    this._spot = (e) => {
      const root = document.documentElement;
      root.style.setProperty('--gx', e.clientX.toFixed(2));
      root.style.setProperty('--gy', e.clientY.toFixed(2));
    };
    document.addEventListener('pointermove', this._spot);
  }
  componentWillUnmount() {
    (this._timers || []).forEach(clearTimeout);
    if (this._mo) this._mo.disconnect();
    clearTimeout(this._moT);
    if (this._io) this._io.disconnect();
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._onMove) window.removeEventListener('mousemove', this._onMove);
    if (this._spot) document.removeEventListener('pointermove', this._spot);
    if (this._onLeave) document.removeEventListener('mouseleave', this._onLeave);
  }
  renderVals() { return { bands: this.state.bands || [] }; }
}
</script>
